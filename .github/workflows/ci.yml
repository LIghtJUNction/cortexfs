# Deterministic Linux quality gate for pull requests and main.
# Required check names (after green on main): "CI / rust", "CI / docs"
# Same cargo commands as .pre-commit-config.yaml / README Development.
#
# CI toolchain: latest stable (documented). Workspace MSRV remains 1.91 in
# Cargo.toml for crates.io.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-stable
          cache-on-failure: true

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --locked --workspace --all-targets --all-features

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Same flags as pre-commit. Cap threads to reduce GHA fs races under load.
      # TMPDIR only for tests: fixture #!/bin/sh agents must live on an exec mount.
      - name: cargo test
        timeout-minutes: 25
        env:
          TMPDIR: ${{ runner.temp }}/cortexfs-tests
        run: |
          mkdir -p "$TMPDIR"
          cargo test --locked --workspace --all-targets --all-features -- --test-threads=2

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Build Docusaurus
        working-directory: docs-site
        run: bun run build
