# Deterministic Linux quality gate for pull requests and main.
# Required check names (after green on main): "CI / rust", "CI / docs"
# Local contract matches .pre-commit-config.yaml and README Development.
#
# CI toolchain: latest stable (documented). Workspace MSRV remains 1.91 in
# Cargo.toml for crates.io; this gate optimizes for a reliable full test run.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Faster test linking on GHA; does not change runtime assertions.
  RUSTFLAGS: "-C debuginfo=line-tables-only"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bwrap is required by agent/sandbox tests and is absent on ubuntu-latest.
      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which
      # breaks bwrap, so allow them for the runner user.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-stable
          cache-on-failure: true

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --locked --workspace --all-targets --all-features

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (compile)
        run: cargo test --locked --workspace --all-targets --all-features --no-run

      # Package-scoped runs keep the same cargo flags as the local contract while
      # bounding hang risk: a stuck package fails at 180s instead of burning the
      # whole job. Matches: cargo test --locked --workspace --all-targets --all-features
      - name: cargo test (run)
        timeout-minutes: 25
        run: |
          cargo test --locked --workspace --all-targets --all-features \
            -- --test-threads=2

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Audit docs/i18n sync
        run: ./scripts/sync-docs-audit.sh

      - name: Build Docusaurus
        working-directory: docs-site
        run: bun run build
