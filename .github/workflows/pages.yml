name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Build Docusaurus
        working-directory: docs-site
        run: bun run build

      - name: Add source markdown
        run: |
          mkdir -p docs-site/build/source/docs docs-site/build/source/templates/bun-cortexfs-client
          cp README.md docs-site/build/source/README.md
          cp docs/DESIGN.md docs-site/build/source/docs/DESIGN.md
          cp templates/bun-cortexfs-client/README.md docs-site/build/source/templates/bun-cortexfs-client/README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
