name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Audit docs/i18n sync
        run: ./scripts/sync-docs-audit.sh

      - name: Build Docusaurus
        working-directory: docs-site
        run: bun run build

      - name: Add source markdown
        run: |
          mkdir -p docs-site/build/source
          cp README.md docs-site/build/source/README.md
          cp -R docs docs-site/build/source/docs
          cp agent.sh/README.md docs-site/build/source/agent.sh.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
