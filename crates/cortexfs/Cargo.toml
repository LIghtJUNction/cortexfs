[package]
name = "cortexfs"
description = "FUSE filesystem interface for agent runtimes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
base64 = "0.23.1"
cortexfs-channels = { version = "0.1.20", path = "../cortexfs-channels" }
cortexfs-context = { version = "0.1.7", path = "../cortexfs-context" }
cortexfs-metadatas = { version = "0.1.20", path = "../cortexfs-metadatas" }
cortexfs-module = { version = "0.1.7", path = "../cortexfs-module" }
cortexfs-paths = { version = "0.1.7", path = "../cortexfs-paths" }
cortexfs-protocol = { version = "0.1.7", path = "../cortexfs-protocol" }
cortexfs-runtime-client = { version = "0.1.7", path = "../cortexfs-runtime-client" }
cortexfs-tool-sdk = { version = "0.1.0", path = "../cortexfs-tool-sdk" }
fuser = "0.18.0"
getrandom = "0.4.3"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
jsonschema = { version = "0.50.0", default-features = false }
keyring = "4.1.4"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
listenfd = "1.0.2"
nix = { version = "0.31.3", features = ["fs", "signal", "socket", "term", "user"] }
parquet = { version = "59.1.0", default-features = false, features = ["arrow"] }
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "multipart", "query", "rustls"] }
rustix = { version = "1.1.3", features = ["net"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring"] }
rustyline = "18.0.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
serde_yaml = "0.9"
sha2 = "0.11.0"
signal-hook = "0.4.4"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
toml = "1.1.4"
tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-native-roots", "handshake"] }
url = "2.5.8"
webpki-roots = "1.0.8"
xattr = "1.6.1"

[lints]
workspace = true

[[bin]]
name = "ctx"
path = "src/bin/ctx/main.rs"

[[bin]]
name = "ctxterm"
path = "src/bin/ctxterm/main.rs"

[[bin]]
name = "ctxchat"
path = "src/bin/ctxchat/main.rs"

[[bin]]
name = "tsh"
path = "src/bin/tsh/main.rs"

[[bin]]
name = "cortexfs-mount"
path = "src/bin/mount/main.rs"

[[bin]]
name = "cortexfs-object-runner"
path = "src/bin/runner/main.rs"

[[bin]]
name = "cortexfs-agent-runtime"
path = "src/bin/runtime/main.rs"

[[bin]]
name = "cortexfs-terminal-broker"
path = "src/bin/cortexfs-terminal-broker.rs"

[[bin]]
name = "cortexfs-auth-runner"
path = "src/bin/auth/main.rs"

[[bin]]
name = "cortexfs-channel"
path = "src/bin/channel/main.rs"
