[package]
name = "cortexfs-channel-mqtt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Process-isolated MQTT channel driver for CortexFS."
readme = "README.md"
keywords = ["agent", "mqtt", "channel", "iot"]
categories = ["network-programming"]

[dependencies]
cortexfs-channels = { version = "0.1.20", path = "../cortexfs-channels" }
cortexfs-paths = { version = "0.1.7", path = "../cortexfs-paths" }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
url = "2.5.8"

[lints]
workspace = true
