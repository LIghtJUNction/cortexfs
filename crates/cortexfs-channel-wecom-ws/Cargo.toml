[package]
name = "cortexfs-channel-wecom-ws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Process-isolated WeCom AI Bot WebSocket channel driver for CortexFS."
readme = "README.md"
keywords = ["agent", "channel", "wecom", "websocket"]
categories = ["network-programming"]

[dependencies]
cortexfs-channels = { version = "0.1.21", path = "../cortexfs-channels" }
cortexfs-paths = { version = "0.1.7", path = "../cortexfs-paths" }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

[lints]
workspace = true
