[package]
name = "cortexfs-channel-wechat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Process-isolated WeChat iLink Bot channel driver for CortexFS."
readme = "README.md"
keywords = ["agent", "channel", "wechat", "ilink"]
categories = ["network-programming"]

[dependencies]
base64 = "0.23.1"
cortexfs-channels = { version = "0.1.19", path = "../cortexfs-channels" }
cortexfs-paths = { version = "0.1.7", path = "../cortexfs-paths" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
