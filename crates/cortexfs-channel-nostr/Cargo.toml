[package]
name = "cortexfs-channel-nostr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Process-isolated Nostr channel driver for CortexFS."
readme = "README.md"
keywords = ["agent", "channel", "nostr", "im"]
categories = ["network-programming"]

[dependencies]
cortexfs-channels = { version = "0.1.19", path = "../cortexfs-channels" }
cortexfs-paths = { version = "0.1.7", path = "../cortexfs-paths" }
nostr-sdk = { version = "0.44", default-features = false, features = ["nip04", "nip59"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
