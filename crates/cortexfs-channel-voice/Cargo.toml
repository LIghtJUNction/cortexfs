[package]
name = "cortexfs-channel-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Process-isolated voice and ClawdTalk channel driver for CortexFS."
readme = "README.md"
keywords = ["agent", "channel", "voice", "telnyx"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
cortexfs-channels = { version = "0.1.21", path = "../cortexfs-channels" }
cortexfs-paths = { version = "0.1.7", path = "../cortexfs-paths" }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
url = "2"
