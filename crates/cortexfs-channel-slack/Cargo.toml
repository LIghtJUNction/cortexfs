[package]
name = "cortexfs-channel-slack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Process-isolated Slack Socket Mode channel driver for CortexFS."
readme = "README.md"
keywords = ["agent", "channel", "slack", "websocket"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
cortexfs-channels = { version = "0.1.18", path = "../cortexfs-channels" }
cortexfs-paths = { version = "0.1.7", path = "../cortexfs-paths" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
