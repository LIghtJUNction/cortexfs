[workspace]
members = [
    "crates/cortexfs",
    "crates/cortexfs-channels",
    "crates/cortexfs-channel-nostr",
    "crates/cortexfs-channel-amqp",
    "crates/cortexfs-channel-wecom-ws",
    "crates/cortexfs-channel-wechat",
    "crates/cortexfs-channel-voice",
    "crates/cortexfs-channel-slack",
    "crates/cortexfs-channel-mqtt",
    "crates/cortexfs-context",
    "crates/cortexfs-metadatas",
    "crates/cortexfs-module",
    "crates/cortexfs-paths",
    "crates/cortexfs-protocol",
    "crates/cortexfs-agent-sdk", "crates/cortexfs-mcp",
    "crates/cortexfs-runtime-client",
    "crates/cortexfs-tool-sdk",
    "crates/cortexfs-channel-tools",
    "tests/sdk-extension-fixture",
]
resolver = "3"

[workspace.package]
version = "0.1.16"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/LIghtJUNction/cortexfs"
readme = "README.md"
keywords = ["ai", "api", "filesystem", "fuse"]
categories = ["filesystem"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
indexing_slicing = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
partial_pub_fields = "deny"
pattern_type_mismatch = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
mod_module_files = "deny"
semicolon_inside_block = "deny"
str_to_string = "deny"
string_slice = "deny"
implicit_clone = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
unwrap_in_result = "deny"
use_debug = "deny"
verbose_file_reads = "deny"
cfg_not_test = "deny"
default_union_representation = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
field_scoped_visibility_modifiers = "deny"
fn_to_numeric_cast_any = "deny"
missing_const_for_fn = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
