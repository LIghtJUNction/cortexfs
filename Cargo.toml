[workspace]
members = [
    "crates/cortex-cli",
    "crates/cortex-core",
    "crates/cortex-providers",
    "crates/cortex-store",
    "crates/cortexd",
    "crates/cortexfs",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/LIghtJUNction/cortexfs"
readme = "README.md"
keywords = ["ai", "api", "filesystem", "fuse"]
categories = ["filesystem"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
pattern_type_mismatch = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
self_named_module_files = "deny"
string_slice = "deny"
implicit_clone = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
verbose_file_reads = "deny"
missing_const_for_fn = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }

[workspace.dependencies]
bytes = "1.11.1"
fuse3 = { version = "0.9.0", features = ["tokio-runtime"] }
tokio = "1.52.3"

[patch.crates-io]
fuse3 = { path = "vendor/fuse3" }
