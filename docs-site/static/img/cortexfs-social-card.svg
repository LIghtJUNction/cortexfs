<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CortexFS social card</title>
  <desc id="desc">CortexFS brand card with logo, CTX initials, and agent runtime file ABI message.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#181b19"/>
      <stop offset="1" stop-color="#0f1110"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="24%" r="52%">
      <stop offset="0" stop-color="#64c8a9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#64c8a9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#d8ff66" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#111211"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="570" y="72" width="540" height="420" rx="8" fill="url(#grid)" opacity="0.8"/>

  <g transform="translate(86 70)">
    <path fill="#d8ff66" d="M46.5 5.7c.4-.2.9-.2 1.4 0l34.4 19.8c.5.3.8.8.8 1.4v39.6c0 .6-.3 1.1-.8 1.4L47.9 87.7c-.5.2-1 .2-1.4 0L12.1 67.9c-.5-.3-.8-.8-.8-1.4V26.9c0-.6.3-1.1.8-1.4L46.5 5.7Z"/>
    <path fill="#111312" d="M52.2 21h10.5L42.1 73.6H31.6L52.2 21Z"/>
    <path fill="#111312" fill-rule="evenodd" d="M22.2 27.8h16.5c1 0 1.9.4 2.5 1.2l3 3.5h12.5c1.8 0 3.1 1.3 3.1 3.1V47c0 1.8-1.3 3.1-3.1 3.1H22.2c-1.8 0-3.1-1.3-3.1-3.1V30.9c0-1.8 1.3-3.1 3.1-3.1Zm0 33.1c0-1.6 1.3-3 3-3h9.7c1.6 0 3 1.4 3 3v9.7c0 1.6-1.4 3-3 3h-9.7c-1.7 0-3-1.4-3-3v-9.7Zm42 3.5a6.6 6.6 0 1 1 10.5 5.5v6.4h6.8v6.2H62.3v-6.2h6.3v-6.2a6.6 6.6 0 0 1-4.4-5.7Z" clip-rule="evenodd"/>
    <path fill="#fffdfa" d="M25.9 61.8h8.3v8.3h-8.3z"/>
    <text x="116" y="56" fill="#fffdfa" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">Cor</text>
    <text x="194" y="56" fill="#64c8a9" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" font-style="italic">TeX</text>
    <text x="270" y="56" fill="#fffdfa" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">fs</text>
  </g>

  <g transform="translate(86 196)">
    <text x="0" y="0" fill="#64c8a9" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="4">FILESYSTEM AS AGENT OS</text>
    <text x="0" y="76" fill="#fffdfa" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="650">Agent runtime</text>
    <text x="0" y="148" fill="#fffdfa" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="650">as a Unix file ABI</text>
    <text x="0" y="216" fill="#bfb6a8" font-family="Inter, Arial, sans-serif" font-size="24">ls, cat, exec, and audit agent runtimes.</text>
  </g>

  <g transform="translate(660 162)" filter="url(#shadow)">
    <rect width="392" height="290" rx="8" fill="url(#panel)" stroke="#fffdfa" stroke-opacity="0.12"/>
    <rect width="392" height="52" rx="8" fill="#101210"/>
    <rect width="54" height="52" rx="8" fill="#d8ff66"/>
    <text x="18" y="33" fill="#111312" font-family="monospace" font-size="14" font-weight="900">ctx</text>
    <text x="76" y="33" fill="#fffdfa" fill-opacity="0.86" font-family="monospace" font-size="14" font-weight="800">/ctx/agent/coder</text>
    <text x="320" y="33" fill="#fffdfa" fill-opacity="0.52" font-family="monospace" font-size="13" font-weight="800">repl</text>
    <text x="30" y="84" fill="#d8ff66" font-family="monospace" font-size="16" font-weight="900">$</text>
    <text x="54" y="84" fill="#fffdfa" font-family="monospace" font-size="16" font-weight="900">ctx agent repl coder</text>
    <g font-family="monospace" font-size="14" font-weight="850">
      <rect x="28" y="112" width="336" height="44" rx="6" fill="#fffdfa" fill-opacity="0.06" stroke="#fffdfa" stroke-opacity="0.09"/>
      <text x="46" y="140" fill="#64c8a9">USER</text>
      <text x="112" y="140" fill="#fffdfa" fill-opacity="0.82">review docs/DESIGN.md</text>
      <rect x="28" y="166" width="336" height="44" rx="6" fill="#fffdfa" fill-opacity="0.06" stroke="#fffdfa" stroke-opacity="0.09"/>
      <text x="46" y="194" fill="#64c8a9">TOOL</text>
      <text x="112" y="194" fill="#fffdfa" fill-opacity="0.82">tsh fs.read</text>
      <rect x="28" y="220" width="336" height="44" rx="6" fill="#d8ff66" fill-opacity="0.08" stroke="#d8ff66" stroke-opacity="0.18"/>
      <text x="46" y="248" fill="#d8ff66">AUDIT</text>
      <text x="112" y="248" fill="#fffdfa" fill-opacity="0.82">*.req.json -> outbox</text>
    </g>
  </g>
