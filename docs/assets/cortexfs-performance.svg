<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CortexFS measured runtime</title>
  <desc id="desc">A live FUSE service snapshot, Inspect AI agent benchmark results, and local CLI probe latency.</desc>
  <defs><style>.bg{fill:#111211}.panel{fill:#181b19;stroke:#fffdfa;stroke-opacity:.12;stroke-width:1.2}.title{font:650 38px Georgia,"Times New Roman",serif;fill:#fffdfa}.label{font:900 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#2a8f73;letter-spacing:2px}.text{font:650 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#bfb6a8}.value{font:700 29px Georgia,"Times New Roman",serif;fill:#fffdfa}.mono{font:850 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fffdfa}.small{font:650 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#8a948f}.lime{fill:#d8ff66}.mint{fill:#2a8f73}.line{stroke:#fffdfa;stroke-opacity:.1}</style></defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="56" y="60">CortexFS runtime, measured in place</text>
  <text class="text" x="56" y="92">Service values are a live snapshot. Agent values are one recorded benchmark run. No cross-tool speed claim.</text>
  <rect x="56" y="112" width="1088" height="38" rx="6" fill="#0f1110" stroke="#fffdfa" stroke-opacity=".12"/>
  <text class="mono" x="76" y="137">/ctx cortexfs fuse rw,nosuid,nodev,relatime,user_id=0,group_id=0,default_permissions,allow_other</text>
  <rect class="panel" x="56" y="170" width="520" height="240" rx="8"/>
  <text class="label" x="80" y="202">LIVE FUSE SERVICE SNAPSHOT</text>
  <text class="value" x="80" y="252">4.4 MiB</text><text class="small" x="80" y="274">mount process RSS</text>
  <text class="value" x="270" y="252">7.3 MiB</text><text class="small" x="270" y="274">process RSS high-water</text>
  <text class="value" x="80" y="326">11.0 MiB</text><text class="small" x="80" y="348">systemd cgroup current</text>
  <text class="value" x="270" y="326">21.4 MiB</text><text class="small" x="270" y="348">systemd cgroup peak</text>
  <line class="line" x1="80" y1="368" x2="552" y2="368"/>
  <text class="mono" x="80" y="394">threads 3 · lifetime CPU 1.3% · PID 1166788</text>
  <rect class="panel" x="596" y="170" width="548" height="240" rx="8"/>
  <text class="label" x="620" y="202">Inspect AI agent benchmark · LOWER LATENCY IS BETTER</text>
  <text class="small" x="620" y="224">runtime success</text><text class="value" x="620" y="258">100%</text><text class="small" x="710" y="256">20/20 · higher is better</text>
  <text class="small" x="885" y="224">exact accuracy</text><text class="value" x="885" y="258">20%</text><text class="small" x="955" y="256">4/20 · higher is better</text>
  <text class="mono" x="620" y="316">latency  p50 6737.81 ms · p95 11432.03 ms</text>
  <text class="mono" x="620" y="346">TTFT     p50 5573.45 ms · p95 10315.34 ms</text>
  <line class="line" x1="620" y1="368" x2="1120" y2="368"/>
  <text class="small" x="620" y="392">route main · dataset 5 · roles 4 · repeat 1 · archived 20/20 · token samples 1/20</text>
  <rect class="panel" x="56" y="430" width="1088" height="228" rx="8"/>
  <text class="label" x="80" y="462">LOCAL CLI PROBES · MEAN WALL TIME · LOWER IS BETTER · N=30 EACH</text>
  <text class="mono" x="80" y="492">ctx status</text>
  <text class="mono lime" x="340" y="492">11.53 ms mean</text>
  <text class="small" x="540" y="492">min 9 ms · max 19 ms · n=30</text>
  <text class="mono" x="80" y="523">ctx ls</text>
  <text class="mono lime" x="340" y="523">3.53 ms mean</text>
  <text class="small" x="540" y="523">min 2 ms · max 5 ms · n=30</text>
  <text class="mono" x="80" y="554">ctx ls tool</text>
  <text class="mono lime" x="340" y="554">5.60 ms mean</text>
  <text class="small" x="540" y="554">min 5 ms · max 7 ms · n=30</text>
  <text class="mono" x="80" y="585">cat /ctx/status</text>
  <text class="mono lime" x="340" y="585">2.23 ms mean</text>
  <text class="small" x="540" y="585">min 2 ms · max 3 ms · n=30</text>
  <text class="mono" x="80" y="616">ctx doctor</text>
  <text class="mono lime" x="340" y="616">747.47 ms mean</text>
  <text class="small" x="540" y="616">min 650 ms · max 881 ms · n=30</text>
  <rect x="56" y="680" width="1088" height="42" rx="6" fill="#0f1110" stroke="#fffdfa" stroke-opacity=".12"/>
  <text class="small" x="76" y="702">Updated 2026-07-14 15:48 UTC · Linux 7.1.3-arch1-2 x86_64 GNU/Linux · cortexfs-git 0.1.0.r602.g927e327-1 · benchmark 20260714T153229.261562Z</text>
  <text class="small" x="76" y="716">provenance docs/benchmarks/20260714-agent-summary.json</text>
</svg>
