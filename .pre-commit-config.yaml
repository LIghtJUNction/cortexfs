fail_fast: true

repos:
  - repo: local
    hooks:
      - id: source-budget
        name: source budget
        entry: scripts/source-budget.sh HEAD
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --locked --workspace --all-targets --all-features
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: scripts/test.sh cargo test --locked --workspace --all-targets --all-features -- --test-threads=1
        language: system
        pass_filenames: false
